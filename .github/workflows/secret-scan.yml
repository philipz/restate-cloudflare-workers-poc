name: Secret Scan

# Complements GitHub's native secret scanning (which only matches known
# provider patterns) with Gitleaks' generic entropy and regex rules, and
# scans full git history rather than just the current tree.
#
# NOTE: this deliberately runs the Gitleaks *binary* (MIT licensed, free for
# everyone) rather than gitleaks/gitleaks-action, because that action requires
# a paid GITLEAKS_LICENSE for organization-owned repositories such as this one.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so previously committed secrets are also detected.
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history
        run: |
          set -euo pipefail
          gitleaks git . \
            --redact \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload report
        # Keep the report even when the scan fails, so findings stay reviewable.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 5
          if-no-files-found: ignore
