name: Secret Scan

# Complements GitHub's native secret scanning (which only matches known
# provider patterns) with Gitleaks' generic entropy and regex rules, and
# scans full git history rather than just the current tree.
# Gitleaks is free for public repositories; no licence key required.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so previously committed secrets are also detected.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
